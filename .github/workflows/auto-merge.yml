name: Auto Merge

on:
  workflow_run:
    workflows:
      - build
    types:
      - completed

concurrency:
  group: auto-merge
  queue: max
  cancel-in-progress: false  # queue concurrent runs instead of cancelling them

permissions: {}

jobs:
  auto-merge:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      (
        github.event.workflow_run.actor.login == 'dependabot[bot]' ||
        github.event.workflow_run.actor.login == 'scala-steward-gatling[bot]'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Merge pull request
        env:
          GH_TOKEN: ${{ secrets.GATLING_CI_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          PR_NUMBER=$(gh api \
            "repos/${REPOSITORY}/pulls" \
            --jq "[.[] | select(.head.sha == \"${HEAD_SHA}\") | .number] | first")

          if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" = "null" ]; then
            echo "No open PR found for commit ${HEAD_SHA}"
            exit 0
          fi

          echo "Auto-merging PR #$PR_NUMBER"
          gh pr merge "$PR_NUMBER" \
            --repo "${REPOSITORY}" \
            --rebase \
            --delete-branch
